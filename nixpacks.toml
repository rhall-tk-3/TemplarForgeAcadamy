# nixpacks.toml — Railway build configuration
# Pins Node 20 LTS and skips devDependencies in the production install.
# Uses system Chromium from Nix — puppeteer-core does NOT download its own browser.

[phases.setup]
nixPkgs = [
  "nodejs_20",
  "chromium",
  "nss",
  "nspr",
  "atk",
  "at-spi2-atk",
  "xorg.libxkbcommon",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXrandr",
  "libgbm",
  "libdrm",
  "alsa-lib",
  "cups",
  "pango",
  "cairo",
  "glib",
  "gtk3"
]

[phases.install]
cmds = ["npm ci --omit=dev"]

[variables]
# Prevent puppeteer-core from trying to download a browser at install time.
# The service locates system Chromium dynamically via `which chromium` at
# runtime, so PUPPETEER_EXECUTABLE_PATH does NOT need to be set here.
# If Railway ever changes the Nix chromium path, set this in the Railway
# Variables panel to override the runtime auto-detection.
PUPPETEER_SKIP_DOWNLOAD = "1"

[start]
cmd = "node server.js"
