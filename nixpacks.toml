# nixpacks.toml — Railway build configuration
# Pins Node 20 LTS. Uses the full `puppeteer` package which downloads
# its own bundled Chromium during `npm install` — no system browser needed.

[phases.setup]
nixPkgs = [
  "nodejs_20",
  "nss",
  "nspr",
  "atk",
  "at-spi2-atk",
  "xorg.libxkbcommon",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXrandr",
  "libgbm",
  "libdrm",
  "alsa-lib",
  "cups",
  "pango",
  "cairo",
  "glib",
  "gtk3"
]

[phases.install]
cmds = ["npm ci --omit=dev"]

[variables]
# Tell puppeteer where to cache the downloaded browser so it persists
# across Railway builds (Railway caches node_modules between builds,
# and puppeteer stores the browser inside its own package directory).
PUPPETEER_CACHE_DIR = "/app/node_modules/puppeteer/.local-chromium"

[start]
cmd = "node server.js"
