# nixpacks.toml — Railway build configuration
# Pins Node 20 LTS and skips devDependencies in the production install.
# Chromium system libs required by puppeteer for PDF certificate generation.

[phases.setup]
nixPkgs = [
  "nodejs_20",
  "chromium",
  "nss",
  "nspr",
  "atk",
  "at-spi2-atk",
  "xorg.libxkbcommon",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXrandr",
  "libgbm",
  "libdrm",
  "alsa-lib",
  "cups",
  "pango",
  "cairo",
  "glib",
  "gtk3"
]

[phases.install]
cmds = ["npm ci --omit=dev"]

[start]
cmd = "node server.js"
