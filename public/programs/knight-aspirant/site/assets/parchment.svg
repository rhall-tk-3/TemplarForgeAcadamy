<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#5f0f12"/>
      <stop offset="100%" stop-color="#7f1418"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" filter="url(#noise)" opacity="0.5"/>
  <g opacity="0.10" fill="#f5deb0">
    <circle cx="230" cy="120" r="170"/>
    <circle cx="1400" cy="180" r="240"/>
    <circle cx="1280" cy="760" r="220"/>
    <circle cx="230" cy="760" r="190"/>
  </g>
</svg>