<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Templar Forge Academy — Welcome</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* ── FULL-SCREEN BACKGROUND ── */
    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Castle background image */
    .bg {
      position: absolute;
      inset: 0;
      background:
        url('/images/castle-bg.png') center center / cover no-repeat;
      z-index: 0;
    }

    /* Dark dramatic overlay so text pops */
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(10, 5, 0, 0.52) 0%,
        rgba(20, 8, 2, 0.38) 40%,
        rgba(10, 5, 0, 0.72) 100%
      );
    }

    /* ── TOP-LEFT CREST ── */
    .crest {
      position: absolute;
      top: 18px;
      left: 22px;
      z-index: 10;
      width: clamp(100px, 12vw, 170px);
      mix-blend-mode: normal;
      filter:
        drop-shadow(0 2px 0px rgba(0,0,0,0.9))
        drop-shadow(0 4px 6px rgba(0,0,0,0.85))
        drop-shadow(0 8px 24px rgba(0,0,0,0.70));
    }

    /* ── TOP-RIGHT SEAL ── */
    .seal {
      position: absolute;
      top: 18px;
      right: 22px;
      z-index: 10;
      width: clamp(100px, 12vw, 170px);
      mix-blend-mode: normal;
      filter:
        drop-shadow(0 2px 0px rgba(0,0,0,0.9))
        drop-shadow(0 4px 6px rgba(0,0,0,0.85))
        drop-shadow(0 8px 24px rgba(0,0,0,0.70));
    }

    /* ── CENTER CONTENT ── */
    .center {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 32px;
      gap: 28px;
    }

    /* Decorative top rule */
    .rule {
      width: clamp(180px, 38vw, 560px);
      height: 2px;
      background: linear-gradient(90deg, transparent, #c9a227, #8b0000, #c9a227, transparent);
    }

    /* ── MAIN TITLE ── */
    .title {
      font-family: 'Cinzel', 'Trajan Pro', 'Palatino Linotype', 'Times New Roman', serif;
      font-size: clamp(1.9rem, 5vw, 4.8rem);
      font-weight: 900;
      letter-spacing: 0.1em;
      line-height: 1.2;
      color: #e8c96a;
      text-transform: uppercase;
      max-width: 900px;
      text-shadow:
        0 2px 0   rgba(0,0,0,0.95),
        0 4px 0   rgba(0,0,0,0.75),
        0 6px 0   rgba(0,0,0,0.50),
        0 8px 12px rgba(0,0,0,0.70),
        0 0 28px  rgba(210,160,30,0.35);
    }

    /* Gold divider cross */
    .divider {
      font-size: 1.6rem;
      color: #c9a227;
      text-shadow: 0 0 12px rgba(201,162,39,0.8);
      letter-spacing: 0.4em;
    }

    /* ── ENTER BUTTON ── */
    .enter-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 14px 48px;
      font-family: 'Palatino Linotype', 'Palatino', serif;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #1a0a00;
      background: linear-gradient(135deg, #e8c84a 0%, #b8860b 45%, #e8c84a 100%);
      border: 2px solid #8b0000;
      border-radius: 4px;
      text-decoration: none;
      box-shadow:
        0 0 0 1px rgba(201,162,39,0.4),
        0 6px 28px rgba(0,0,0,0.65),
        inset 0 1px 0 rgba(255,255,180,0.35);
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .enter-btn:hover {
      background: linear-gradient(135deg, #ffd84a 0%, #c8960b 45%, #ffd84a 100%);
      box-shadow:
        0 0 0 2px rgba(201,162,39,0.7),
        0 8px 36px rgba(0,0,0,0.75),
        0 0 30px rgba(197,150,20,0.4);
      transform: translateY(-2px);
    }

    /* ── BOTTOM FOOTER ── */
    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 18px 24px 20px;
      background: linear-gradient(0deg, rgba(0,0,0,0.82) 0%, transparent 100%);
    }

    .footer-line {
      width: clamp(120px, 30vw, 440px);
      height: 1px;
      background: linear-gradient(90deg, transparent, #c9a227, transparent);
      margin-bottom: 10px;
    }

    .footer-name {
      font-family: 'Algerian', 'Palatino Linotype', 'Palatino', 'Book Antiqua', serif;
      font-size: clamp(0.75rem, 1.8vw, 1.15rem);
      font-weight: 700;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #e8d08a;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 14px rgba(197,150,20,0.5);
      text-align: center;
    }

    .footer-trademark {
      font-family: 'Palatino Linotype', 'Palatino', serif;
      font-size: clamp(0.62rem, 1.1vw, 0.82rem);
      letter-spacing: 0.14em;
      color: #b8984a;
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
      margin-top: 3px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .crest { width: 80px; top: 10px; left: 10px; }
      .seal  { width: 76px; top: 8px;  right: 10px; }
      .title { font-size: 1.65rem; }
      .enter-btn { padding: 12px 32px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- Background castle image -->
    <div class="bg"></div>

    <!-- TOP LEFT: Order Crest (no white bg — PNG with transparency) -->
    <img class="crest" src="/images/order-crest.png" alt="Order Crest">

    <!-- TOP RIGHT: Order Seal (no background) -->
    <img class="seal" src="/images/order-seal.png" alt="Order Seal">

    <!-- CENTER: Main welcome content -->
    <div class="center">
      <div class="rule"></div>

      <h1 class="title">Welcome to<br>Templar Forge Academy</h1>

      <div class="divider">✦ ✠ ✦</div>

      <a class="enter-btn" href="/dashboard">Enter the Forge</a>

      <div class="rule"></div>
    </div>

    <!-- BOTTOM FOOTER: Order name + trademark -->
    <footer class="footer">
      <div class="footer-line"></div>
      <div class="footer-name">Knights Templar of the Kingdom of Christ&#8482;</div>
      <div class="footer-trademark">All Rights Reserved &nbsp;·&nbsp; Est. 2026</div>
    </footer>

  </div>
</body>
</html>
