<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — Templar Forge Academy</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/shared.css">
  <style>
    /* ── LOGIN PAGE — FULLY RESPONSIVE ── */
    html, body { width:100%; min-height:100%; }

    body {
      background-color: #000;
      background-image: url('/images/login-cross.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: clamp(140px, 44vmin, 480px);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(16px,4vh,40px) clamp(12px,4vw,32px);
    }

    .auth-box { width:100%; max-width:440px; min-width:0; }

    .auth-header { text-align:center; margin-bottom:clamp(16px,3vh,28px); }
    .auth-header img {
      width:clamp(64px,14vw,100px);
      filter:drop-shadow(0 4px 16px rgba(0,0,0,0.8));
      margin-bottom:12px;
    }
    .auth-header h1 {
      font-family:'Cinzel',serif;
      font-size:clamp(1.1rem,4vw,1.6rem);
      font-weight:900; color:#e8c96a;
      text-shadow:0 2px 0 rgba(0,0,0,0.9),0 4px 12px rgba(0,0,0,0.7);
    }
    .auth-header p { color:#7a6040; font-size:clamp(0.8rem,2.2vw,0.95rem); margin-top:6px; letter-spacing:0.06em; }

    .auth-card { padding:clamp(18px,4vw,32px) clamp(14px,4vw,28px); }
    .form-stack { display:flex; flex-direction:column; gap:clamp(14px,2.5vh,20px); }

    .form-footer { text-align:center; margin-top:18px; font-size:clamp(0.8rem,2vw,0.9rem); color:#6a5030; }
    .form-footer a {
      color:#c9a84c; text-decoration:none;
      font-family:'Cinzel',serif; font-size:clamp(0.72rem,1.8vw,0.82rem); font-weight:600;
    }
    .form-footer a:hover { color:#e8c96a; text-decoration:underline; }

    .back-link {
      display:block; text-align:center; margin-top:18px;
      font-family:'Cinzel',serif; font-size:clamp(0.68rem,1.6vw,0.75rem);
      font-weight:600; letter-spacing:0.14em; text-transform:uppercase;
      color:#4a3010; text-decoration:none;
    }
    .back-link:hover { color:#7a6030; }

    /* Responsive */
    @media (max-width:480px) {
      body { background-size:clamp(100px,36vmin,260px); justify-content:flex-start; padding-top:clamp(24px,6vh,48px); }
      .auth-box { max-width:100%; }
    }
    @media (max-width:360px) {
      body { background-size:clamp(80px,28vmin,180px); }
      .auth-header h1 { font-size:1rem; }
      .auth-card { padding:14px 12px; }
    }
    @media (max-height:600px) and (orientation:landscape) {
      body { justify-content:flex-start; padding-top:12px; background-size:clamp(80px,28vmin,180px); }
      .auth-header { margin-bottom:10px; }
      .auth-header img { width:52px; margin-bottom:6px; }
      .form-stack { gap:10px; }
    }
  </style>
</head>
<body>
  <div class="auth-box">

    <div class="auth-header">
      <img src="/images/order-crest.png" alt="Order Crest">
      <h1>Enter the Forge</h1>
      <p>Sign in to your account</p>
    </div>

    <div class="card auth-card">

      <div id="alert" class="alert"></div>

      <form class="form-stack" id="login-form" onsubmit="handleLogin(event)">

        <!-- Brother / Sister toggle -->
        <div class="form-group" id="salutation-group">
          <label>I am a</label>
          <div class="sex-toggle">
            <input type="radio" name="salutation" id="brother" value="Brother" checked>
            <label for="brother">⚔ Brother</label>
            <input type="radio" name="salutation" id="sister" value="Sister">
            <label for="sister">✦ Sister</label>
          </div>
        </div>

        <!-- Name -->
        <div class="form-group">
          <label for="username">Name</label>
          <input type="text" id="username" name="username"
                 placeholder="your name" autocomplete="username" required>
        </div>

        <!-- Passcode -->
        <div class="form-group">
          <label for="password">Passcode</label>
          <input type="password" id="password" name="password"
                 placeholder="passcode" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn-primary">Sign In</button>

      </form>

      <div class="form-footer">
        No account yet? <a href="/register">Create Account</a>
      </div>

    </div>

    <a class="back-link" href="/">← Return to the Gates</a>

  </div>

  <script>
    function showAlert(msg, type) {
      const el = document.getElementById('alert');
      el.textContent = msg;
      el.className = 'alert ' + type;
    }
    function clearAlert() {
      const el = document.getElementById('alert');
      el.className = 'alert';
      el.textContent = '';
    }

    async function handleLogin(e) {
      e.preventDefault();
      clearAlert();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();
      if (res.ok) {
        window.location.href = data.redirect;
      } else {
        showAlert(data.error || 'Sign in failed.', 'error');
      }
    }
  </script>
</body>
</html>
