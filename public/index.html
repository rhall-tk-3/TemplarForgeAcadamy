<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover fills iPhone notch / Dynamic Island safely -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060203">
  <title>Templar Forge Academy — Welcome</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Preconnect so Google Fonts doesn't block first paint -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- font-display=swap keeps text visible while font loads -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      /* Fallback background color shown instantly before image loads */
      background-color: #060203;
      /* Allow scroll on very small screens so nothing is ever clipped */
      overflow: auto;
    }

    /* ── FULL-SCREEN PAGE ── */
    .page {
      position: relative;
      width: 100%;
      /* dvh = dynamic viewport height — correct on iOS Safari (excludes browser chrome).
         Falls back to 100vh on browsers that don't support dvh. */
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      /* Safe area insets for notched phones (iPhone X+) */
      padding-left:  env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* ── BACKGROUND IMAGE ── */
    .bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      /* Solid fallback while image loads */
      background-color: #0a0400;
    }
    .bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      image-rendering: auto;
    }

    /* Dark dramatic overlay so text pops */
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(8, 4, 0, 0.48) 0%,
        rgba(15, 6, 0, 0.28) 40%,
        rgba(8, 4, 0, 0.68) 100%
      );
    }

    /* ── TOP-LEFT CREST ANCHOR ── */
    .crest-link {
      position: absolute;
      top:  clamp(8px, 1.5vh, 18px);
      left: clamp(10px, 1.8vw, 22px);
      z-index: 10;
      display: block;
      /* Minimum 44×44px tap target (Apple HIG / Google Material) */
      min-width:  44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      -webkit-tap-highlight-color: transparent;
    }
    .crest {
      width: clamp(52px, 10vw, 150px);
      mix-blend-mode: normal;
      filter:
        drop-shadow(0 2px 0px  rgba(0,0,0,0.9))
        drop-shadow(0 4px 6px  rgba(0,0,0,0.85))
        drop-shadow(0 8px 24px rgba(0,0,0,0.70));
      cursor: pointer;
      transition: filter 0.2s ease, transform 0.2s ease;
      display: block;
    }

    /* ── TOP-RIGHT SEAL ANCHOR ── */
    .seal-link {
      position: absolute;
      top:   clamp(8px, 1.5vh, 18px);
      right: clamp(10px, 1.8vw, 22px);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      /* Minimum 44×44px tap target */
      min-width:  44px;
      min-height: 44px;
      -webkit-tap-highlight-color: transparent;
    }
    .seal {
      width: clamp(52px, 10vw, 150px);
      mix-blend-mode: normal;
      filter:
        drop-shadow(0 2px 0px  rgba(0,0,0,0.9))
        drop-shadow(0 4px 6px  rgba(0,0,0,0.85))
        drop-shadow(0 8px 24px rgba(0,0,0,0.70));
      cursor: pointer;
      transition: filter 0.2s ease, transform 0.2s ease;
      display: block;
    }

    /* Hover effects only on devices that actually have a hover pointer
       (prevents sticky-hover bug on iOS/Android after tap) */
    @media (hover: hover) and (pointer: fine) {
      .crest:hover,
      .seal:hover {
        filter:
          drop-shadow(0 2px 0px  rgba(0,0,0,0.9))
          drop-shadow(0 4px 10px rgba(0,0,0,0.9))
          drop-shadow(0 10px 30px rgba(201,162,39,0.5));
        transform: scale(1.04);
      }
    }

    /* ── CENTER CONTENT ── */
    .center {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      /* Top/bottom padding keeps content clear of crest/seal and footer */
      padding: clamp(90px, 14vh, 140px) clamp(16px, 5vw, 48px) clamp(80px, 12vh, 120px);
      gap: clamp(12px, 3vh, 28px);
      width: 100%;
      /* Prevent content touching notch edges */
      padding-left:  max(clamp(16px, 5vw, 48px), env(safe-area-inset-left));
      padding-right: max(clamp(16px, 5vw, 48px), env(safe-area-inset-right));
    }

    /* Decorative rule line */
    .rule {
      width: clamp(160px, 38vw, 560px);
      height: 2px;
      background: linear-gradient(90deg, transparent, #c9a227, #8b0000, #c9a227, transparent);
    }

    /* ── MAIN TITLE ── */
    .title {
      font-family: 'Cinzel', 'Trajan Pro', 'Palatino Linotype', 'Times New Roman', serif;
      font-size: clamp(1.3rem, 5.5vw, 4.8rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      line-height: 1.2;
      color: #e8c96a;
      text-transform: uppercase;
      max-width: min(900px, 90vw);
      /* Prevent overflow on narrow screens */
      word-break: break-word;
      overflow-wrap: break-word;
      text-shadow:
        0 2px 0    rgba(0,0,0,0.95),
        0 4px 0    rgba(0,0,0,0.75),
        0 6px 0    rgba(0,0,0,0.50),
        0 8px 12px rgba(0,0,0,0.70),
        0 0  28px  rgba(210,160,30,0.35);
    }

    /* Gold divider with cross */
    .divider {
      font-size: clamp(1rem, 3vw, 1.6rem);
      color: #c9a227;
      text-shadow: 0 0 12px rgba(201,162,39,0.8);
      letter-spacing: 0.4em;
      /* Prevent emoji/symbol rendering as plain text on some Android */
      font-variant-emoji: text;
    }

    /* ── ENTER BUTTON ── */
    .enter-btn {
      display: inline-block;
      margin-top: 4px;
      padding: clamp(11px, 2vh, 14px) clamp(28px, 6vw, 48px);
      font-family: 'Palatino Linotype', 'Palatino', Georgia, serif;
      font-size: clamp(0.85rem, 2.2vw, 1.05rem);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #1a0a00;
      background: linear-gradient(135deg, #e8c84a 0%, #b8860b 45%, #e8c84a 100%);
      border: 2px solid #8b0000;
      border-radius: 4px;
      text-decoration: none;
      box-shadow:
        0 0 0 1px rgba(201,162,39,0.4),
        0 6px 28px rgba(0,0,0,0.65),
        inset 0 1px 0 rgba(255,255,180,0.35);
      transition: all 0.25s ease;
      cursor: pointer;
      /* Touch-friendly: no callout, no tap flash, easy to tap */
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      /* Minimum tap target height */
      min-height: 44px;
      /* Prevent text from wrapping awkwardly */
      white-space: nowrap;
    }

    @media (hover: hover) and (pointer: fine) {
      .enter-btn:hover {
        background: linear-gradient(135deg, #ffd84a 0%, #c8960b 45%, #ffd84a 100%);
        box-shadow:
          0 0 0 2px rgba(201,162,39,0.7),
          0 8px 36px rgba(0,0,0,0.75),
          0 0 30px rgba(197,150,20,0.4);
        transform: translateY(-2px);
      }
    }

    /* Pressed state for touch devices */
    .enter-btn:active {
      transform: translateY(1px);
      box-shadow:
        0 0 0 1px rgba(201,162,39,0.5),
        0 3px 14px rgba(0,0,0,0.65);
    }

    /* ── BOTTOM FOOTER ── */
    .footer {
      position: absolute;
      bottom: 0;
      left:  0;
      right: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: clamp(10px, 2.5vh, 18px) clamp(12px, 3vw, 24px) clamp(12px, 2.5vh, 20px);
      /* Push text above home-bar on iPhones */
      padding-bottom: max(clamp(12px, 2.5vh, 20px), env(safe-area-inset-bottom));
      background: linear-gradient(0deg, rgba(0,0,0,0.82) 0%, transparent 100%);
    }

    .footer-line {
      width: clamp(100px, 30vw, 440px);
      height: 1px;
      background: linear-gradient(90deg, transparent, #c9a227, transparent);
      margin-bottom: 8px;
    }

    .footer-name {
      font-family: 'Algerian', 'Palatino Linotype', 'Palatino', 'Book Antiqua', Georgia, serif;
      font-size: clamp(0.58rem, 1.8vw, 1.05rem);
      font-weight: 700;
      letter-spacing: clamp(0.08em, 0.22em, 0.26em);
      text-transform: uppercase;
      color: #e8d08a;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 14px rgba(197,150,20,0.5);
      text-align: center;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .footer-trademark {
      font-family: 'Palatino Linotype', 'Palatino', Georgia, serif;
      font-size: clamp(0.6rem, 1.1vw, 0.82rem);
      letter-spacing: 0.14em;
      color: #b8984a;
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
      margin-top: 3px;
    }

    /* ── SMALL PHONES (≤ 640px) ── */
    @media (max-width: 640px) {
      .crest { width: clamp(44px, 12vw, 72px); }
      .seal  { width: clamp(44px, 12vw, 68px); }
      .title { font-size: clamp(1.15rem, 5.5vw, 1.75rem); letter-spacing: 0.05em; }
      .enter-btn { padding: 12px 28px; font-size: 0.85rem; letter-spacing: 0.12em; }
      .rule  { width: clamp(100px, 68vw, 300px); }
      .center { gap: 10px; }
    }

    /* ── VERY SMALL PHONES (≤ 380px — iPhone SE, Galaxy A series) ── */
    @media (max-width: 380px) {
      .crest { width: 42px; }
      .seal  { width: 40px; }
      .title { font-size: 1rem; letter-spacing: 0.04em; }
      .enter-btn { padding: 11px 20px; font-size: 0.8rem; letter-spacing: 0.1em; }
      .footer-name { font-size: 0.52rem; letter-spacing: 0.06em; }
      .divider { letter-spacing: 0.2em; }
    }

    /* ── LANDSCAPE MOBILE (short screens — iPhone landscape, etc.) ── */
    @media (max-height: 500px) and (orientation: landscape) {
      .center {
        padding-top:    clamp(50px, 10vh, 80px);
        padding-bottom: clamp(50px, 10vh, 80px);
        gap: 8px;
      }
      .title { font-size: clamp(0.95rem, 3.5vh, 1.4rem); }
      .crest { width: clamp(36px, 7vh, 60px); }
      .seal  { width: clamp(36px, 7vh, 60px); }
      .rule  { display: none; }
    }

    /* ── LARGE SCREENS / TABLETS ── */
    @media (min-width: 1024px) {
      .title { font-size: clamp(2.8rem, 4.5vw, 4.8rem); }
    }

    /* ── PRINT — hide decorative elements ── */
    @media print {
      .bg, .crest-link, .seal-link, .footer { display: none; }
      .center { padding: 20px; }
      .title { color: #000; text-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- Background castle image — low priority since content is above the fold -->
    <div class="bg">
      <img src="/images/castle-bg-new.jpg" alt="" aria-hidden="true" fetchpriority="high" decoding="async" loading="eager">
    </div>

    <!-- TOP LEFT: Order Crest — links to thecastlekeep.org -->
    <a class="crest-link" href="https://thecastlekeep.org" target="_blank" rel="noopener noreferrer" aria-label="Visit The Castle Keep">
      <img class="crest" src="/images/order-crest.png" alt="Order Crest">
    </a>

    <!-- TOP RIGHT: Order Seal — links to tkkc.info -->
    <a class="seal-link" href="https://tkkc.info" target="_blank" rel="noopener noreferrer" aria-label="Visit TKKC">
      <img class="seal" src="/images/order-seal.png" alt="Order Seal">
    </a>

    <!-- CENTER: Main welcome content -->
    <div class="center">
      <div class="rule"></div>

      <h1 class="title">Welcome to<br>Templar Forge Academy</h1>

      <div class="divider" aria-hidden="true">✦ ✠ ✦</div>

      <a class="enter-btn" href="/login">Enter the Forge</a>

      <div class="rule"></div>
    </div>

    <!-- BOTTOM FOOTER: Order name + trademark -->
    <footer class="footer">
      <div class="footer-line"></div>
      <div class="footer-name">Knights Templar of the Kingdom of Christ&#8482;</div>
      <div class="footer-trademark">All Rights Reserved &nbsp;·&nbsp; Est. 2026</div>
    </footer>

  </div>

</body>
</html>
