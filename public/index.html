<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Templar Forge Academy — Welcome</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      /* Allow scroll on very small screens so nothing is ever clipped */
      overflow: auto;
    }

    /* ── FULL-SCREEN BACKGROUND ── */
    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Castle background image */
    .bg {
      position: absolute;
      inset: 0;
      background:
        url('/images/castle-bg.png') center center / cover no-repeat;
      z-index: 0;
    }

    /* Dark dramatic overlay so text pops */
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(10, 5, 0, 0.52) 0%,
        rgba(20, 8, 2, 0.38) 40%,
        rgba(10, 5, 0, 0.72) 100%
      );
    }

    /* ── TOP-LEFT CREST ── */
    .crest {
      width: clamp(60px, 10vw, 150px);
      mix-blend-mode: normal;
      filter:
        drop-shadow(0 2px 0px rgba(0,0,0,0.9))
        drop-shadow(0 4px 6px rgba(0,0,0,0.85))
        drop-shadow(0 8px 24px rgba(0,0,0,0.70));
      cursor: pointer;
      transition: filter 0.2s ease, transform 0.2s ease;
    }
    .crest:hover {
      filter:
        drop-shadow(0 2px 0px rgba(0,0,0,0.9))
        drop-shadow(0 4px 10px rgba(0,0,0,0.9))
        drop-shadow(0 10px 30px rgba(201,162,39,0.5));
      transform: scale(1.04);
    }

    /* ── TOP-RIGHT SEAL ── */
    .seal {
      position: absolute;
      top: clamp(10px, 2vh, 18px);
      right: clamp(10px, 2vw, 22px);
      z-index: 10;
      width: clamp(60px, 10vw, 150px);
      mix-blend-mode: normal;
      filter:
        drop-shadow(0 2px 0px rgba(0,0,0,0.9))
        drop-shadow(0 4px 6px rgba(0,0,0,0.85))
        drop-shadow(0 8px 24px rgba(0,0,0,0.70));
    }

    /* ── CENTER CONTENT ── */
    .center {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(80px, 14vh, 140px) clamp(16px, 5vw, 48px) clamp(80px, 12vh, 120px);
      gap: clamp(14px, 3vh, 28px);
      width: 100%;
    }

    /* Decorative top rule */
    .rule {
      width: clamp(180px, 38vw, 560px);
      height: 2px;
      background: linear-gradient(90deg, transparent, #c9a227, #8b0000, #c9a227, transparent);
    }

    /* ── MAIN TITLE ── */
    .title {
      font-family: 'Cinzel', 'Trajan Pro', 'Palatino Linotype', 'Times New Roman', serif;
      font-size: clamp(1.35rem, 5.5vw, 4.8rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      line-height: 1.2;
      color: #e8c96a;
      text-transform: uppercase;
      max-width: min(900px, 90vw);
      word-break: break-word;
      text-shadow:
        0 2px 0   rgba(0,0,0,0.95),
        0 4px 0   rgba(0,0,0,0.75),
        0 6px 0   rgba(0,0,0,0.50),
        0 8px 12px rgba(0,0,0,0.70),
        0 0 28px  rgba(210,160,30,0.35);
    }

    /* Gold divider cross */
    .divider {
      font-size: clamp(1rem, 3vw, 1.6rem);
      color: #c9a227;
      text-shadow: 0 0 12px rgba(201,162,39,0.8);
      letter-spacing: 0.4em;
    }

    /* ── ENTER BUTTON ── */
    .enter-btn {
      display: inline-block;
      margin-top: 4px;
      padding: clamp(10px, 2vh, 14px) clamp(24px, 6vw, 48px);
      font-family: 'Palatino Linotype', 'Palatino', serif;
      font-size: clamp(0.82rem, 2.2vw, 1.05rem);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #1a0a00;
      background: linear-gradient(135deg, #e8c84a 0%, #b8860b 45%, #e8c84a 100%);
      border: 2px solid #8b0000;
      border-radius: 4px;
      text-decoration: none;
      box-shadow:
        0 0 0 1px rgba(201,162,39,0.4),
        0 6px 28px rgba(0,0,0,0.65),
        inset 0 1px 0 rgba(255,255,180,0.35);
      transition: all 0.25s ease;
      cursor: pointer;
      /* Tap-friendly on touch screens */
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .enter-btn:hover {
      background: linear-gradient(135deg, #ffd84a 0%, #c8960b 45%, #ffd84a 100%);
      box-shadow:
        0 0 0 2px rgba(201,162,39,0.7),
        0 8px 36px rgba(0,0,0,0.75),
        0 0 30px rgba(197,150,20,0.4);
      transform: translateY(-2px);
    }

    /* ── BOTTOM FOOTER ── */
    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: clamp(12px, 2.5vh, 18px) clamp(12px, 3vw, 24px) clamp(14px, 2.5vh, 20px);
      background: linear-gradient(0deg, rgba(0,0,0,0.82) 0%, transparent 100%);
    }

    .footer-line {
      width: clamp(120px, 30vw, 440px);
      height: 1px;
      background: linear-gradient(90deg, transparent, #c9a227, transparent);
      margin-bottom: 10px;
    }

    .footer-name {
      font-family: 'Algerian', 'Palatino Linotype', 'Palatino', 'Book Antiqua', serif;
      font-size: clamp(0.6rem, 1.8vw, 1.05rem);
      font-weight: 700;
      letter-spacing: clamp(0.1em, 0.26em, 0.26em);
      text-transform: uppercase;
      color: #e8d08a;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 14px rgba(197,150,20,0.5);
      text-align: center;
      word-break: break-word;
    }

    .footer-trademark {
      font-family: 'Palatino Linotype', 'Palatino', serif;
      font-size: clamp(0.62rem, 1.1vw, 0.82rem);
      letter-spacing: 0.14em;
      color: #b8984a;
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
      margin-top: 3px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .crest { width: clamp(50px, 13vw, 76px); }
      .seal  { width: clamp(50px, 13vw, 72px); }
      .title { font-size: clamp(1.15rem, 5.5vw, 1.8rem); letter-spacing: 0.06em; }
      .enter-btn { padding: 11px 28px; font-size: 0.85rem; letter-spacing: 0.14em; }
      .rule { width: clamp(120px, 70vw, 320px); }
    }

    @media (max-width: 380px) {
      .crest { width: 46px; }
      .seal  { width: 44px; top: 6px; right: 8px; }
      .title { font-size: 1.05rem; }
      .enter-btn { padding: 10px 22px; font-size: 0.78rem; }
      .footer-name { font-size: 0.55rem; letter-spacing: 0.08em; }
    }

    /* Landscape mobile */
    @media (max-height: 500px) and (orientation: landscape) {
      .center { padding-top: 60px; padding-bottom: 60px; gap: 10px; }
      .title { font-size: clamp(1rem, 3.5vh, 1.5rem); }
      .crest, .seal { width: clamp(40px, 8vh, 70px); }
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- Background castle image -->
    <div class="bg"></div>

    <!-- TOP LEFT: Order Crest — links to thecastlekeep.org -->
    <a href="https://thecastlekeep.org" target="_blank" rel="noopener noreferrer" style="position:absolute;top:clamp(8px,1.5vh,18px);left:clamp(10px,1.8vw,22px);z-index:10;display:block;">
      <img class="crest" src="/images/order-crest.png" alt="Order Crest" style="position:static;top:auto;left:auto;">
    </a>

    <!-- TOP RIGHT: Order Seal (no background) -->
    <img class="seal" src="/images/order-seal.png" alt="Order Seal">

    <!-- CENTER: Main welcome content -->
    <div class="center">
      <div class="rule"></div>

      <h1 class="title">Welcome to<br>Templar Forge Academy</h1>

      <div class="divider">✦ ✠ ✦</div>

      <a class="enter-btn" href="/login">Enter the Forge</a>

      <div class="rule"></div>
    </div>

    <!-- BOTTOM FOOTER: Order name + trademark -->
    <footer class="footer">
      <div class="footer-line"></div>
      <div class="footer-name">Knights Templar of the Kingdom of Christ&#8482;</div>
      <div class="footer-trademark">All Rights Reserved &nbsp;·&nbsp; Est. 2026</div>
    </footer>

  </div>
</body>
</html>
