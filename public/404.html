<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found — KTKC</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0a0804;color:#d4c5a0;font-family:'Crimson Text',Georgia,serif;
         min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
    .cross{font-size:5rem;color:rgba(184,150,12,.15);margin-bottom:20px}
    h1{font-family:'Cinzel',serif;font-size:clamp(1.4rem,4vw,2.2rem);color:#e8c040;margin-bottom:12px;letter-spacing:.06em}
    p{color:#8a7a58;font-size:1.05rem;margin-bottom:28px;max-width:440px}
    a{display:inline-flex;align-items:center;gap:6px;padding:9px 22px;border:1px solid #b8960c;
      color:#e8c040;font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:.1em;text-decoration:none;
      border-radius:2px;transition:all .2s}
    a:hover{background:rgba(184,150,12,.12)}
  </style>
</head>
<body>
  <div class="cross">✠</div>
  <h1>404 — Page Not Found</h1>
  <p>The page you are looking for does not exist or has been moved.</p>
  <a href="/">⌂ Return to Home</a>

<script src="/assets/document-link-enhancer.js"></script>
</body>
</html>
