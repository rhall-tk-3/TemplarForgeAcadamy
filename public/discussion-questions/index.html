<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discussion Questions — Templar Forge Academy</title>
  <link rel="stylesheet" href="/shared.css" />
  <style>
    /* ── Scaffold ── */
    body {
      min-height: 100vh;
      background: transparent;
      color: #e8dcc8;
      font-family: 'Crimson Text', Georgia, serif;
    }

    /* ── Top bar ── */
    .dq-topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 56px;
      background: rgba(12, 6, 2, 0.96);
      border-bottom: 2px solid #7b1113;
      box-shadow: 0 2px 16px rgba(0,0,0,0.7);
    }
    .dq-topbar-brand {
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: #d4af37;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .dq-topbar-brand span { color: #7b1113; }
    .dq-back-link {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      color: #c9a227;
      text-decoration: none;
      letter-spacing: 0.06em;
      transition: color 0.2s;
    }
    .dq-back-link:hover { color: #f0d060; }

    /* ── Page layout ── */
    .dq-page {
      max-width: 820px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* ── Page heading ── */
    .dq-heading {
      font-family: 'Cinzel', serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: #d4af37;
      letter-spacing: 0.06em;
      text-align: center;
      margin-bottom: 0.3rem;
    }
    .dq-sub {
      text-align: center;
      font-size: 0.95rem;
      color: #9a7840;
      margin-bottom: 2rem;
      letter-spacing: 0.03em;
    }

    /* ── Program badge ── */
    .dq-prog-badge {
      display: inline-block;
      background: rgba(180,140,60,0.12);
      border: 1px solid rgba(180,140,60,0.35);
      border-radius: 20px;
      padding: 4px 16px;
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      color: #c9a227;
      letter-spacing: 0.07em;
      text-align: center;
      margin: 0 auto 2rem;
      display: block;
      width: fit-content;
    }

    /* ── Week accordion ── */
    .week-block {
      border: 1px solid #2a1408;
      border-radius: 12px;
      margin-bottom: 14px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .week-block.completed { border-color: #1a3a18; }
    .week-block.current   { border-color: #5a2a08; }

    .week-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      cursor: pointer;
      user-select: none;
      background: linear-gradient(135deg, #140804, #0c0502);
      transition: background 0.2s;
    }
    .week-header:hover { background: linear-gradient(135deg, #1e0c06, #140804); }
    .week-block.completed .week-header { background: linear-gradient(135deg, #081408, #050c05); }
    .week-block.current   .week-header { background: linear-gradient(135deg, #1a0a04, #100804); }

    .week-header-left { display: flex; flex-direction: column; gap: 3px; }
    .week-label {
      font-family: 'Cinzel', serif;
      font-size: 0.76rem;
      color: #5a3020;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .week-title {
      font-family: 'Cinzel', serif;
      font-size: 0.92rem;
      font-weight: 700;
      color: #c8a060;
    }
    .week-block.completed .week-title { color: #60b060; }
    .week-block.current   .week-title { color: #e8b860; }

    .week-header-right { display: flex; align-items: center; gap: 10px; }
    .week-status-badge {
      font-family: 'Cinzel', serif;
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      padding: 3px 10px;
      border-radius: 10px;
      border: 1px solid;
    }
    .badge-done    { background: rgba(0,80,0,.18);   border-color: #2a6020; color: #80d080; }
    .badge-open    { background: rgba(139,60,0,.18); border-color: #6a3010; color: #e8a860; }
    .badge-current { background: rgba(180,100,0,.20); border-color: #8a4010; color: #f0c060; }
    .badge-pending { background: rgba(120,80,0,.22);  border-color: #a07010; color: #f0c840; }
    .week-chevron {
      font-size: 0.65rem;
      color: #4a2010;
      transition: transform 0.2s;
    }
    .week-block.open .week-chevron { transform: rotate(180deg); }

    /* ── Week body ── */
    .week-body {
      display: none;
      padding: 18px 20px 20px;
      border-top: 1px solid #2a1408;
      background: rgba(10,5,2,0.6);
    }
    .week-block.completed .week-body { border-top-color: #1a3a18; }
    .week-block.current   .week-body { border-top-color: #5a2a08; }
    .week-block.open .week-body { display: block; }

    /* ── Already submitted view ── */
    .submitted-notice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: rgba(0,60,0,.15);
      border: 1px solid #1a4a18;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 0.88rem;
      color: #70b870;
    }
    .submitted-notice-icon { font-size: 1rem; margin-top: 1px; }
    .submitted-date { font-size: 0.78rem; color: #4a8a48; margin-top: 2px; }

    /* ── Q&A pairs (submitted view) ── */
    .qa-pair { margin-bottom: 18px; }
    .qa-question {
      font-family: 'Cinzel', serif;
      font-size: 0.82rem;
      color: #a07840;
      margin-bottom: 6px;
      letter-spacing: 0.03em;
    }
    .qa-answer {
      background: rgba(180,140,60,0.06);
      border: 1px solid rgba(180,140,60,0.18);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.9rem;
      color: #d0b880;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    /* ── Input form (unsubmitted) ── */
    .dq-intro {
      font-size: 0.9rem;
      color: #8a6840;
      margin-bottom: 18px;
      line-height: 1.65;
    }
    .dq-field { margin-bottom: 20px; }
    .dq-label {
      font-family: 'Cinzel', serif;
      font-size: 0.82rem;
      color: #a07840;
      display: block;
      margin-bottom: 7px;
      letter-spacing: 0.03em;
    }
    .dq-label span {
      font-family: 'Crimson Text', serif;
      font-size: 0.96rem;
      color: #c8a060;
      font-style: normal;
      letter-spacing: 0;
      display: block;
      margin-top: 2px;
    }
    .dq-textarea {
      width: 100%;
      min-height: 110px;
      background: rgba(180,140,60,0.06);
      border: 1px solid rgba(180,140,60,0.28);
      border-radius: 7px;
      color: #e8d0a0;
      font-family: 'Crimson Text', Georgia, serif;
      font-size: 0.98rem;
      line-height: 1.6;
      padding: 10px 14px;
      resize: vertical;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .dq-textarea:focus {
      outline: none;
      border-color: rgba(180,140,60,0.6);
      background: rgba(180,140,60,0.09);
    }
    .dq-textarea:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .dq-submit-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .dq-submit-btn {
      font-family: 'Cinzel', serif;
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      background: linear-gradient(135deg, #b8920a, #8a6a06);
      color: #fff8e0;
      border: none;
      border-radius: 7px;
      padding: 10px 24px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }
    .dq-submit-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #d4a80c, #a07a08);
    }
    .dq-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .dq-msg {
      font-size: 0.88rem;
      display: none;
    }
    .dq-msg.ok    { color: #70c870; display: inline; }
    .dq-msg.error { color: #e07070; display: inline; }

    /* ── Empty / loading states ── */
    .dq-loading {
      text-align: center;
      color: #5a3a18;
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      padding: 3rem 0;
      letter-spacing: 0.06em;
    }
    .dq-empty {
      text-align: center;
      color: #5a3a18;
      font-size: 0.92rem;
      padding: 2rem 0;
    }

    /* ── Paused banner ── */
    .paused-banner {
      display: none;
      background: rgba(60,30,0,.35);
      border: 1px solid #6a3010;
      border-radius: 8px;
      padding: 12px 18px;
      margin-bottom: 20px;
      font-size: 0.88rem;
      color: #c08040;
      line-height: 1.55;
    }
    .paused-banner.show { display: block; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .dq-topbar { padding: 0 1rem; }
      .dq-page { padding: 1.5rem 1rem 3rem; }
      .dq-heading { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

<!-- Background (matches academy theme) -->
<div id="page-bg" style="
  position:fixed;inset:0;z-index:-1;
  background: linear-gradient(180deg,#0c0604 0%,#060302 100%);
"></div>

<!-- Top bar -->
<header class="dq-topbar">
  <div class="dq-topbar-brand">
    ✠ <span>Templar</span> Forge Academy
  </div>
  <a class="dq-back-link" href="/member">← Back to Dashboard</a>
</header>

<!-- Main page -->
<main class="dq-page">

  <h1 class="dq-heading">✠ Discussion Questions</h1>
  <p class="dq-sub">Complete discussion questions for any accessible week. Your answers are recorded and may be reviewed by the Schoolmaster.</p>

  <div id="prog-badge" class="dq-prog-badge" style="display:none;"></div>

  <div id="paused-banner" class="paused-banner"></div>

  <div id="week-list">
    <div class="dq-loading">✠ &nbsp; Loading your lessons…</div>
  </div>

</main>

<script>
(async function () {
  'use strict';

  const weekList   = document.getElementById('week-list');
  const progBadge  = document.getElementById('prog-badge');
  const pausedEl   = document.getElementById('paused-banner');

  // ── 1. Fetch all weeks + submission status ──────────────
  let data;
  try {
    const resp = await fetch('/api/progression/me/discussion-weeks', { credentials: 'include' });
    if (resp.status === 401) { window.location.href = '/login'; return; }
    if (resp.status === 404) {
      weekList.innerHTML = `<div class="dq-empty">
        No program is currently assigned to your account.<br>
        Return to your <a href="/member" style="color:#c9a227;">dashboard</a>.
      </div>`;
      return;
    }
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    data = await resp.json();
  } catch (err) {
    weekList.innerHTML = `<div class="dq-empty" style="color:#e07070;">
      Could not load discussion questions. Please refresh or
      <a href="/member" style="color:#c9a227;">return to your dashboard</a>.
    </div>`;
    return;
  }

  const { programSlug, programTitle, currentWeek, programStatus, statusNote, weeks } = data;
  const paused = (programStatus === 'paused');

  // Program badge
  progBadge.textContent = `✠ ${programTitle}`;
  progBadge.style.display = 'block';

  // Paused banner
  if (paused) {
    pausedEl.textContent = statusNote
      ? `Your program is paused: "${statusNote}" — You may review previous answers but cannot submit new responses.`
      : 'Your program is currently paused. Submission is disabled until reactivated by the Schoolmaster.';
    pausedEl.classList.add('show');
  }

  // ── 2. Render week list ─────────────────────────────────
  if (!weeks || weeks.length === 0) {
    weekList.innerHTML = `<div class="dq-empty">
      No weeks available yet. Complete your first week to see discussion questions here.
    </div>`;
    return;
  }

  weekList.innerHTML = '';

  // Sort descending so most recent week appears first
  const sorted = [...weeks].sort((a, b) => b.week - a.week);

  sorted.forEach((wk, idx) => {
    const isCurrent  = (wk.week === currentWeek);
    const isComplete = wk.submitted;
    const blockClass = isComplete ? 'completed' : (isCurrent ? 'current' : '');

    // Auto-open: most recent incomplete week (first in sorted list that isn't submitted)
    const autoOpen = (idx === sorted.findIndex(w => !w.submitted)) ? ' open' : '';

    // Determine exact badge state: submitted+graded vs submitted+pending vs unsubmitted
    const isGraded  = wk.submitted && wk.reviewedAt && wk.grade && wk.grade !== '';
    const isPending = wk.submitted && !isGraded;
    const statusBadge = isGraded
      ? `<span class="week-status-badge badge-done">✔ Approved — ${escHtml(wk.grade)}</span>`
      : isPending
        ? `<span class="week-status-badge badge-pending">⏳ Awaiting SM Review</span>`
        : isCurrent
          ? `<span class="week-status-badge badge-current">⟳ Current Week</span>`
          : `<span class="week-status-badge badge-open">○ Open</span>`;

    const block = document.createElement('div');
    block.className = `week-block ${blockClass}${autoOpen}`;
    block.dataset.week = wk.week;

    // ── Header ──
    block.innerHTML = `
      <div class="week-header">
        <div class="week-header-left">
          <span class="week-label">Week ${wk.week}</span>
          <span class="week-title">${escHtml(wk.title)}</span>
        </div>
        <div class="week-header-right">
          ${statusBadge}
          <span class="week-chevron">▼</span>
        </div>
      </div>
      <div class="week-body" id="wb-${wk.week}"></div>
    `;

    // ── Body content ──
    const body = block.querySelector(`#wb-${wk.week}`);
    if (wk.submitted) {
      body.innerHTML = buildSubmittedView(wk);
    } else {
      body.innerHTML = buildFormView(wk, paused);
      if (!paused) attachFormHandler(body, wk, block, progBadge);
    }

    // ── Toggle accordion ──
    block.querySelector('.week-header').addEventListener('click', () => {
      block.classList.toggle('open');
    });

    weekList.appendChild(block);
  });

  // ── Build: already-submitted read-only view ──────────────
  function buildSubmittedView(wk) {
    const dateStr = wk.submittedAt
      ? new Date(wk.submittedAt).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' })
      : '';
    const gradedDateStr = wk.reviewedAt
      ? new Date(wk.reviewedAt).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' })
      : '';

    const isGraded = wk.reviewedAt && wk.grade && wk.grade !== '';

    const statusNotice = isGraded
      ? `<div class="submitted-notice" style="background:rgba(0,80,0,.15);border-color:#2a6020;">
           <span class="submitted-notice-icon" style="color:#80d080;">✔</span>
           <div>
             <div style="color:#80d080;font-weight:700;">Approved by Schoolmaster — ${escHtml(wk.grade)}</div>
             ${gradedDateStr ? `<div class="submitted-date">Reviewed ${gradedDateStr}</div>` : ''}
             ${wk.notes ? `<div style="margin-top:6px;padding:6px 10px;background:rgba(125,211,252,0.08);border-radius:4px;font-size:0.85rem;color:#bae6fd;"><strong>SM Notes:</strong> ${escHtml(wk.notes)}</div>` : ''}
           </div>
         </div>`
      : `<div class="submitted-notice" style="background:rgba(120,80,0,.15);border-color:#a07010;">
           <span class="submitted-notice-icon" style="color:#f0c840;">⏳</span>
           <div>
             <div style="color:#f0c840;font-weight:700;">Submitted — Awaiting Schoolmaster Review</div>
             ${dateStr ? `<div class="submitted-date">Submitted ${dateStr}</div>` : ''}
             <div style="margin-top:4px;font-size:0.8rem;color:#a09030;">Your answers have been received. The Schoolmaster will review and approve your discussion.</div>
           </div>
         </div>`;

    const qaPairs = (wk.questions || []).map((q, i) => {
      const ans = (wk.answers[i] || {}).answer || wk.answers[i] || '';
      return `<div class="qa-pair">
        <div class="qa-question">Q${i+1}. ${escHtml(q)}</div>
        <div class="qa-answer">${escHtml(String(ans))}</div>
      </div>`;
    }).join('');

    return `
      ${statusNotice}
      <div style="margin-top:18px;">${qaPairs}</div>
    `;
  }

  // ── Build: blank form for submission ─────────────────────
  function buildFormView(wk, isPaused) {
    const fields = (wk.questions || []).map((q, i) => `
      <div class="dq-field">
        <label class="dq-label" for="dq-${wk.week}-${i}">
          Question ${i+1}
          <span>${escHtml(q)}</span>
        </label>
        <textarea
          class="dq-textarea"
          id="dq-${wk.week}-${i}"
          data-index="${i}"
          placeholder="Write your response here…"
          ${isPaused ? 'disabled' : ''}
        ></textarea>
      </div>
    `).join('');

    const submitHtml = isPaused
      ? `<p style="color:#8a5a30;font-size:0.88rem;">Submission disabled while program is paused.</p>`
      : `<div class="dq-submit-row">
           <button class="dq-submit-btn" id="dq-btn-${wk.week}">✠ Submit Week ${wk.week} Discussion</button>
           <span class="dq-msg" id="dq-msg-${wk.week}"></span>
         </div>`;

    return `
      <p class="dq-intro">
        Answer each question below thoughtfully and honestly.
        Your responses will be submitted to the Schoolmaster for review and approval.
      </p>
      ${fields}
      ${submitHtml}
    `;
  }

  // ── Attach submit handler for a week form ────────────────
  function attachFormHandler(body, wk, block, badge) {
    const btn = body.querySelector(`#dq-btn-${wk.week}`);
    const msg = body.querySelector(`#dq-msg-${wk.week}`);
    if (!btn) return;

    btn.addEventListener('click', async () => {
      const textareas = body.querySelectorAll('.dq-textarea');
      const answers = [];

      for (let i = 0; i < textareas.length; i++) {
        const val = textareas[i].value.trim();
        if (!val) {
          msg.className = 'dq-msg error';
          msg.textContent = `Please answer Question ${i + 1} before submitting.`;
          textareas[i].focus();
          return;
        }
        answers.push({
          question: wk.questions[i] || `Question ${i + 1}`,
          answer:   val
        });
      }

      btn.disabled = true;
      btn.textContent = 'Submitting…';
      msg.className = 'dq-msg';
      msg.textContent = '';

      try {
        const resp = await fetch('/api/progression/me/exam', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            programSlug,
            week: wk.week,
            answers
          })
        });
        const result = await resp.json();
        if (resp.ok && result.ok) {
          // Mark week as submitted in-place — swap form for submitted view
          wk.submitted   = true;
          wk.submittedAt = new Date().toISOString();
          wk.answers     = answers;
          wk.reviewedAt  = null;   // pending SM review
          wk.grade       = '';     // no grade yet

          block.classList.remove('current', 'open');
          block.classList.add('completed', 'open');
          block.querySelector('.week-header').style.background = '';

          // Update status badge to pending (not graded)
          const badge = block.querySelector('.week-status-badge');
          if (badge) {
            badge.className = 'week-status-badge badge-pending';
            badge.textContent = '⏳ Awaiting SM Review';
          }

          // Replace body with submitted view
          const bodyEl = block.querySelector('.week-body');
          bodyEl.innerHTML = buildSubmittedView(wk);

        } else {
          throw new Error(result.error || 'Submission failed.');
        }
      } catch (err) {
        msg.className = 'dq-msg error';
        msg.textContent = `Error: ${err.message}`;
        btn.disabled = false;
        btn.textContent = `✠ Submit Week ${wk.week} Discussion`;
      }
    });
  }

  // ── Utility ──────────────────────────────────────────────
  function escHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

}());
</script>
</body>
</html>
