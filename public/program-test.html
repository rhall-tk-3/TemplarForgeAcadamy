<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weekly Test | KTKC</title>
  <link rel="stylesheet" href="/shared.css"/>
  <style>
    body { background:#0a0804; color:#e0cc98; font-family:'Crimson Text',serif; font-size:1.05rem; min-height:100vh; }
    .page-wrap { max-width:860px; margin:0 auto; padding:36px 24px 80px; }

    .back-row { display:flex; align-items:center; gap:12px; margin-bottom:32px; flex-wrap:wrap; }
    .back-link {
      display:inline-block; font-family:'Cinzel',serif; font-size:0.78rem; color:#b8960c;
      text-decoration:none; border:1px solid rgba(184,150,12,0.4); border-radius:4px;
      padding:6px 14px; letter-spacing:0.05em; transition:background 0.2s,color 0.2s;
    }
    .back-link:hover { background:rgba(184,150,12,0.12); color:#e8c040; }

    /* Week selector */
    .week-selector { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:36px; }
    .week-sel-btn {
      font-family:'Cinzel',serif; font-size:0.74rem; color:#b8960c;
      border:1px solid rgba(184,150,12,0.3); border-radius:4px; padding:5px 14px;
      background:transparent; cursor:pointer; transition:background 0.2s,color 0.2s; letter-spacing:0.05em;
    }
    .week-sel-btn:hover, .week-sel-btn.active { background:rgba(184,150,12,0.14); color:#e8c040; border-color:rgba(232,192,64,0.5); }

    /* Test container */
    .test-header { border-bottom:1px solid rgba(232,192,64,0.22); padding-bottom:20px; margin-bottom:28px; }
    .test-header h1 { font-family:'Cinzel',serif; font-size:1.5rem; color:#e8c040; letter-spacing:0.05em; margin-bottom:6px; }
    .test-header .sub { font-family:'Cinzel',serif; font-size:0.8rem; color:#b8960c; letter-spacing:0.1em; text-transform:uppercase; }

    /* Questions */
    .question-card { border:1px solid rgba(232,192,64,0.13); border-radius:8px; background:rgba(232,192,64,0.02); padding:20px 22px; margin-bottom:18px; }
    .question-card .q-num { font-family:'Cinzel',serif; font-size:0.72rem; color:#b8960c; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:8px; }
    .question-card .q-text { font-size:1.02rem; color:#e8d8a0; line-height:1.6; margin-bottom:16px; }
    .choices { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:8px; }
    .choice-item label {
      display:flex; align-items:flex-start; gap:12px; cursor:pointer;
      padding:10px 14px; border-radius:5px; border:1px solid rgba(232,192,64,0.1);
      background:rgba(232,192,64,0.02); transition:background 0.15s,border-color 0.15s;
    }
    .choice-item label:hover { background:rgba(232,192,64,0.06); border-color:rgba(232,192,64,0.22); }
    .choice-item input[type=radio] { margin-top:3px; accent-color:#c9a84c; flex-shrink:0; }
    .choice-item .opt-letter { font-family:'Cinzel',serif; font-size:0.8rem; color:#b8960c; font-weight:600; flex-shrink:0; min-width:18px; }
    .choice-item .opt-text { color:#d8c48a; font-size:0.95rem; line-height:1.5; }

    /* After grading */
    .choice-item.correct label { background:rgba(80,180,80,0.08); border-color:rgba(80,200,80,0.3); }
    .choice-item.incorrect label { background:rgba(200,60,60,0.08); border-color:rgba(200,80,80,0.3); }
    .choice-item.correct .opt-text { color:#98e898; }
    .choice-item.incorrect .opt-text { color:#e89898; }
    .rationale { margin-top:10px; padding:10px 12px; background:rgba(232,192,64,0.05); border-radius:4px; font-size:0.9rem; color:#c8b87a; font-style:italic; line-height:1.55; display:none; }
    .rationale.show { display:block; }

    /* Submit / score */
    .submit-row { display:flex; align-items:center; gap:16px; margin-top:28px; flex-wrap:wrap; }
    .submit-btn {
      font-family:'Cinzel',serif; font-size:0.82rem; letter-spacing:0.06em; color:#0a0804;
      background:#c9a84c; border:none; border-radius:5px; padding:10px 28px;
      cursor:pointer; transition:background 0.2s;
    }
    .submit-btn:hover { background:#e8c040; }
    .submit-btn:disabled { background:#5a4a1c; color:#a09060; cursor:not-allowed; }

    .score-box { border:1px solid rgba(232,192,64,0.25); border-radius:8px; padding:20px 24px; margin-top:28px; display:none; text-align:center; }
    .score-box.show { display:block; }
    .score-box.passed { background:rgba(10,58,26,0.45); border:1px solid #1a6a30; }
    .score-box.failed { background:rgba(90,26,10,0.3); border:1px solid #7a2a0a; }
    .score-box .score-num { font-family:'Cinzel',serif; font-size:2.5rem; color:#e8c040; line-height:1; }
    .score-box.passed .score-num { color:#4caf78; }
    .score-box.failed .score-num { color:#e08060; }
    .score-box .score-label { font-family:'Cinzel',serif; font-size:0.8rem; color:#b8960c; letter-spacing:0.1em; text-transform:uppercase; margin-top:6px; margin-bottom:16px; }
    .score-box.passed .score-label { color:#2a9a50; }
    .score-box.failed .score-label { color:#b05030; }
    .score-box .score-verdict { font-family:'Cinzel',serif; font-size:1.1rem; letter-spacing:0.06em; margin-bottom:10px; }
    .score-box.passed .score-verdict { color:#4caf78; }
    .score-box.failed .score-verdict { color:#e08060; }
    .score-box .score-msg { color:#d4be88; font-size:1rem; line-height:1.6; font-style:italic; }
    .retry-btn {
      display:inline-block; font-family:'Cinzel',serif; font-size:0.78rem; color:#b8960c;
      border:1px solid rgba(184,150,12,0.4); border-radius:4px; padding:7px 18px;
      cursor:pointer; margin-top:14px; background:transparent; letter-spacing:0.05em;
      transition:background 0.2s,color 0.2s;
    }
    .retry-btn:hover { background:rgba(184,150,12,0.12); color:#e8c040; }

    /* Discussion */
    .discussion-section { margin-top:40px; border-top:1px solid rgba(232,192,64,0.15); padding-top:28px; }
    .discussion-section h2 { font-family:'Cinzel',serif; font-size:0.9rem; color:#b8960c; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:18px; }
    .discussion-card { border:1px solid rgba(232,192,64,0.1); border-radius:6px; padding:14px 18px; margin-bottom:12px; background:rgba(232,192,64,0.02); }
    .discussion-card .d-prompt { color:#e0cc98; font-size:1rem; line-height:1.6; margin-bottom:6px; }
    .discussion-card .d-purpose { color:#a89060; font-size:0.88rem; font-style:italic; }

    .loading { text-align:center; color:#b8960c; font-family:'Cinzel',serif; font-size:0.9rem; padding:60px 20px; letter-spacing:0.08em; }
    .error-msg { background:rgba(200,50,50,0.08); border:1px solid rgba(200,50,50,0.25); border-radius:6px; padding:16px 20px; color:#e8a0a0; }
  </style>
</head>
<body>
  <script src="/assets/js/academy-guard.js" data-protect="member" defer></script>


<div class="topbar">
  <div class="topbar-inner">
    <span class="topbar-brand">&#10013; KTKC</span>
    <span class="topbar-motto">Non Nobis, Domine &mdash; Not Unto Us, O Lord</span>
    <nav class="topbar-nav">
      <a href="/member">Dashboard</a>
      <a href="/reading-log" id="topbar-reading-log-link">Reading Log</a>
      <a href="/lesson">Lesson</a>
    </nav>
  </div>
</div>

<div class="page-wrap" id="pageWrap">
  <div class="loading">&#10013; Loading Test&hellip;</div>
</div>

<script>
(function() {
  const parts = window.location.pathname.split('/').filter(Boolean);
  // /programs/{slug}/test  OR  /programs/{slug}/test/week/{n}
  const slug = parts[1] || '';
  // Update topbar reading-log link with ?from= param
  if (slug) {
    const tlEl = document.getElementById('topbar-reading-log-link');
    if (tlEl) tlEl.href = `/reading-log?from=${slug}`;
  }
  let weekNum = null;
  if (parts[3] === 'week' && parts[4]) weekNum = parseInt(parts[4], 10);

  const PROG_TITLES = {
    levie:'Levie',squire:'Squire',corporal:'Corporal',sergeant:'Sergeant',
    sfc:'Sergeant First Class','knight-aspirant':'Knight Aspirant',knight:'Knight',
    lieutenant:'Lieutenant',captain:'Captain',major:'Major',commander:'Commander',
  };
  const PROG_WEEKS = {
    levie:8,squire:8,corporal:8,sergeant:8,sfc:8,'knight-aspirant':8,
    knight:4,lieutenant:12,captain:12,major:12,commander:12,
  };
  const totalWeeks = PROG_WEEKS[slug] || 8;
  const progLabel = PROG_TITLES[slug] || slug;

  // If no week selected, default to week 1
  if (!weekNum) weekNum = 1;

  document.title = `${progLabel} — Week ${weekNum} Test | KTKC`;

  loadWeek(weekNum);

  function loadWeek(wk) {
    weekNum = wk;
    document.title = `${progLabel} — Week ${wk} Test | KTKC`;
    document.getElementById('pageWrap').innerHTML = `<div class="loading">&#10013; Loading Week ${wk} Test&hellip;</div>`;

    Promise.all([
      fetch(`/api/assessment/${slug}/test/${wk}`).then(r => r.json()),
      fetch(`/api/assessment/${slug}/discussion/${wk}`).then(r => r.json()),
    ]).then(([testData, discData]) => {
      renderTest(testData, discData, wk);
    }).catch(err => {
      document.getElementById('pageWrap').innerHTML = `<div class="error-msg">&#9888; Failed to load test data. ${err.message}</div>`;
    });
  }

  function renderTest(testData, discData, wk) {
    if (!testData || !testData.multiple_choice_questions) {
      document.getElementById('pageWrap').innerHTML = `<div class="error-msg">&#9888; Test data not found for ${progLabel} Week ${wk}.</div>`;
      return;
    }

    const questions = testData.multiple_choice_questions;
    const weekTitle = testData.week_title || `Week ${wk}`;

    // Build week selector
    let selHtml = '<div class="week-selector">';
    for (let i = 1; i <= totalWeeks; i++) {
      selHtml += `<button class="week-sel-btn${i === wk ? ' active' : ''}" data-week="${i}">Week ${i}</button>`;
    }
    selHtml += '</div>';

    // Build questions
    let qHtml = '';
    questions.forEach((q, qi) => {
      qHtml += `
        <div class="question-card" id="qcard-${qi}">
          <div class="q-num">Question ${qi + 1} of ${questions.length}</div>
          <div class="q-text">${escH(q.question)}</div>
          <ul class="choices" id="choices-${qi}">
            ${q.choices.map((c, ci) => `
              <li class="choice-item" id="choice-${qi}-${ci}" data-opt="${c.option}">
                <label>
                  <input type="radio" name="q${qi}" value="${c.option}"/>
                  <span class="opt-letter">${c.option}.</span>
                  <span class="opt-text">${escH(c.text)}</span>
                </label>
              </li>`).join('')}
          </ul>
          <div class="rationale" id="rationale-${qi}">${escH(q.rationale || '')}</div>
        </div>`;
    });

    // Build discussion section
    let dHtml = '';
    if (discData && discData.discussion_questions && discData.discussion_questions.length) {
      dHtml = `<div class="discussion-section">
        <h2>&#10022; Discussion Questions</h2>
        ${discData.discussion_questions.map(d => `
          <div class="discussion-card">
            <div class="d-prompt">${escH(d.prompt)}</div>
            <div class="d-purpose"><em>Purpose:</em> ${escH(d.purpose)}</div>
          </div>`).join('')}
      </div>`;
    }

    const html = `
      <div class="back-row">
        <a class="back-link" href="/member">&larr; Dashboard</a>
        <a class="back-link" href="/programs/${slug}/reading">&#128218; Reading Guide</a>
        <a class="back-link" href="/reading-log?from=${slug}">&#128214; Reading Log</a>
      </div>

      <div class="test-header">
        <h1>&#10013; ${escH(progLabel)} School &mdash; ${escH(weekTitle)}</h1>
        <div class="sub">Weekly Assessment &mdash; ${questions.length} Questions</div>
      </div>

      ${selHtml}

      <form id="testForm">
        ${qHtml}
        <div class="submit-row">
          <button type="button" class="submit-btn" id="submitBtn">Submit Answers</button>
          <span style="font-size:0.88rem;color:#9a8860;font-style:italic;">Select an answer for each question before submitting.</span>
        </div>
      </form>

      <div class="score-box" id="scoreBox">
        <div class="score-verdict" id="scoreVerdict"></div>
        <div class="score-num" id="scoreNum">—</div>
        <div class="score-label" id="scoreLabel">Your Score</div>
        <div class="score-msg" id="scoreMsg"></div>
        <button class="retry-btn" id="retryBtn">&#8635; Try Again</button>
      </div>

      ${dHtml}`;

    document.getElementById('pageWrap').innerHTML = html;

    // Wire up week selector
    document.querySelectorAll('.week-sel-btn').forEach(btn => {
      btn.addEventListener('click', () => loadWeek(parseInt(btn.dataset.week, 10)));
    });

    // Submit button
    document.getElementById('submitBtn').addEventListener('click', () => gradeTest(questions));
    document.getElementById('retryBtn').addEventListener('click', () => loadWeek(weekNum));
  }

  function gradeTest(questions) {
    let answered = 0, correct = 0;
    questions.forEach((q, qi) => {
      const selected = document.querySelector(`input[name="q${qi}"]:checked`);
      if (!selected) return;
      answered++;
      const chosen = selected.value;
      const isCorrect = (chosen === q.correct_answer);
      if (isCorrect) correct++;

      // Highlight choices
      document.querySelectorAll(`#choices-${qi} .choice-item`).forEach(li => {
        li.style.pointerEvents = 'none';
        if (li.dataset.opt === q.correct_answer) li.classList.add('correct');
        if (li.dataset.opt === chosen && !isCorrect) li.classList.add('incorrect');
      });

      // Show rationale
      const rat = document.getElementById(`rationale-${qi}`);
      if (rat) rat.classList.add('show');
    });

    if (answered < questions.length) {
      alert('Please answer all questions before submitting.');
      return;
    }

    const PASSING_SCORE = 70; // must match program-hub.html passingScore default
    const pct = Math.round((correct / questions.length) * 100);
    const passed = pct >= PASSING_SCORE;

    let verdict = '';
    let label   = '';
    let msg     = '';
    if (passed) {
      verdict = '\u2720 Passed';
      label   = `Your Score \u2014 ${pct}%`;
      msg     = 'Well done, brother. Your knowledge is sound. Head to your Program Hub to submit this week\'s work and log your reading progress.';
    } else if (pct >= 50) {
      verdict = '\u2717 Not Passed';
      label   = `Your Score \u2014 ${pct}%`;
      msg     = `A solid effort, but you need ${PASSING_SCORE}% to pass. Review the marked questions, re-read the assigned material, and try again in 24 hours.`;
    } else {
      verdict = '\u2717 Not Passed';
      label   = `Your Score \u2014 ${pct}%`;
      msg     = `You need ${PASSING_SCORE}% to pass. Return to the Required Reading guide, review the assigned sources carefully, and try again in 24 hours.`;
    }

    const scoreBox = document.getElementById('scoreBox');
    document.getElementById('scoreVerdict').textContent = verdict;
    document.getElementById('scoreNum').textContent     = `${correct} / ${questions.length}`;
    document.getElementById('scoreLabel').textContent   = label;
    document.getElementById('scoreMsg').textContent     = msg;
    scoreBox.classList.add('show', passed ? 'passed' : 'failed');
    document.getElementById('submitBtn').disabled = true;
    scoreBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function escH(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Auth check
  fetch('/auth/me')
    .then(r => { if (!r.ok) { window.location.replace('/login'); return null; } return r.json(); })
    .then(d => { if (!d || (!d.id && !d.username)) window.location.replace('/login'); })
    .catch(() => window.location.replace('/login'));
})();
</script>

<script src="/assets/document-link-enhancer.js"></script>
</body>
</html>
